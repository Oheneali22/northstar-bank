apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: northstar-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: northstar-bank
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/Oheneali22/northstar-bank.git
    targetRevision: environment/dev
    path: k8s/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: northstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
