name: Continuous Delivery

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout environment branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: environment/dev

      - name: Update image tags
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          sed --in-place --regexp-extended \
            "s|(northstar-web:)sha-[0-9a-f]{40}|\1${IMAGE_TAG}|g" \
            k8s/dev/web.yaml
          sed --in-place --regexp-extended \
            "s|(northstar-core-api:)sha-[0-9a-f]{40}|\1${IMAGE_TAG}|g" \
            k8s/dev/core-api.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "This image version is already deployed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/dev/web.yaml k8s/dev/core-api.yaml
          git commit --message "Deploy ${{ github.event.workflow_run.head_sha }} to development"
          git push origin HEAD:environment/dev
